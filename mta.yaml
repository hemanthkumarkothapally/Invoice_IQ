_schema-version: 3.3.0
ID: Invoice_IQ
description: A simple CAP project.
version: 1.0.0
modules:
  - name: Invoice_IQ-srv
    type: nodejs
    path: gen/srv
    properties:
      DOX_CLIENT_ID: default
      DOX_SCHEMA_NAME: SAP_invoice_schema
      DOX_TENANT_ID: a231d21f-a6ef-46f0-8871-0e6414f831d2
      DOX_MOCK: "false"
      EXTRACT_CONFIDENCE_THRESHOLD: "0.8"
      S4_MOCK: "false"
      MATCH_AUTO_THRESHOLD: "0.9"
      MATCH_MIN_SCORE: "0.05"
      MATCH_LOOKBACK_MONTHS: "12"
    requires:
      - name: Invoice_IQ-db
      - name: Invoice_IQ-destination
      - name: uaa_Invoice_IQ
      - name: Invoice_IQ-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 512M
      disk-quota: 512M
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: Invoice_IQ-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: Invoice_IQ-db
    parameters:
      buildpack: nodejs_buildpack
  - name: Invoice_IQ-destination-content
    type: com.sap.application.content
    requires:
      - name: Invoice_IQ-destination
        parameters:
          content-target: true
      - name: Invoice_IQ_html_repo_host
        parameters:
          service-key:
            name: Invoice_IQ_html_repo_host-key
      - name: uaa_Invoice_IQ
        parameters:
          service-key:
            name: uaa_Invoice_IQ-key
    parameters:
      content:
        instance:
          destinations:
            - Name: Invoice_IQ_Invoice_IQ_html_repo_host
              ServiceInstanceName: Invoice_IQ-html5-app-host-service
              ServiceKeyName: Invoice_IQ_html_repo_host-key
              sap.cloud.service: Invoice_IQ
            - Authentication: OAuth2UserTokenExchange
              Name: Invoice_IQ_uaa_Invoice_IQ
              ServiceInstanceName: Invoice_IQ-xsuaa-service
              ServiceKeyName: uaa_Invoice_IQ-key
              sap.cloud.service: Invoice_IQ
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
  - name: Invoice_IQ-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: Invoice_IQ_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - invoiceiqui.zip
          name: invoiceiqui
          target-path: resources/
  - name: invoiceiqui
    type: html5
    path: app/invoice_iq_ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: Invoice_IQ-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Invoice_IQ-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
  - name: Invoice_IQ_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: Invoice_IQ-html5-app-host-service
      service-plan: app-host
  - name: uaa_Invoice_IQ
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: Invoice_IQ-xsuaa-service
      service-plan: application
  - name: Invoice_IQ-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
